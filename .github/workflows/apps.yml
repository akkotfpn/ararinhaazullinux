# SPDX-License-Identifier: GPL-3.0-or-later
# CI leve dos aplicativos (apps/): compila as Penas e os apps num runner do
# GitHub. O binário que vai no Ararinha é compilado pela Ninhada, dentro do
# próprio sistema, com as crates travadas no Cargo.lock.
name: Apps

on:
  push:
    paths: ["apps/**", ".github/workflows/apps.yml"]
  pull_request:
    paths: ["apps/**", ".github/workflows/apps.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bibliotecas de sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxkbcommon-dev libwayland-dev libasound2-dev libcrypt-dev pkg-config

      - name: Compilar
        working-directory: apps
        run: set -o pipefail; cargo build --release 2>&1 | tee ../compilacao.log

      - name: Erros (resumo)
        if: failure()
        run: grep -E "^error" -A14 compilacao.log | head -400

      - name: Cargo.lock (para commit)
        if: always()
        run: |
          echo "::group::Cargo.lock"
          cat apps/Cargo.lock || true
          echo "::endgroup::"

  # Auditoria: clippy, falhas conhecidas nas crates (RustSec) e quantos
  # blocos unsafe existem. Não impede o build; o resumo fica no run.
  auditoria:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Bibliotecas de sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxkbcommon-dev libwayland-dev libasound2-dev libcrypt-dev pkg-config

      - name: Clippy
        working-directory: apps
        run: |
          cargo clippy --release --locked 2>&1 | tee ../clippy.log || true
          {
            echo "## Clippy (apps)"
            echo
            echo '```'
            grep -E "^(warning|error)" ../clippy.log | sed 's/`[^`]*`/X/g' | sort | uniq -c | sort -rn | head -40
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: cargo-audit (RustSec)
        working-directory: apps
        run: |
          cargo install cargo-audit --locked -q
          cargo audit 2>&1 | tee ../audit.log || true
          {
            echo "## cargo-audit (apps)"
            echo
            echo '```'
            grep -E "^(Crate|Version|Title|ID|Solution|warning|error)" ../audit.log | head -80
            tail -3 ../audit.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: unsafe
        run: |
          {
            echo "## Blocos unsafe (apps)"
            echo
            echo '```'
            grep -rn --include=*.rs -E "unsafe *(\{|fn|impl)" apps | grep -v "/target/" | awk -F: '{print $1}' | sort | uniq -c | sort -rn
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
