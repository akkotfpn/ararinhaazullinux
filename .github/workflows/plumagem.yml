# SPDX-License-Identifier: GPL-3.0-or-later
# CI leve da Plumagem: compila o compositor num runner do GitHub, com as
# bibliotecas de sistema do Ubuntu. Serve para pegar erros de compilação
# rápido; o binário que vai no Ararinha é compilado pela Ninhada, dentro do
# próprio sistema, com as crates travadas no Cargo.lock.
name: Plumagem

on:
  push:
    paths: ["plumagem/**", ".github/workflows/plumagem.yml"]
  pull_request:
    paths: ["plumagem/**", ".github/workflows/plumagem.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bibliotecas de sistema
        run: |
          # O espelho da Azure às vezes some do DNS: tenta de novo e, se não
          # der, usa o archive.ubuntu.com direto.
          for t in 1 2 3; do sudo apt-get update -qq && break; sleep 10; done
          if ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            sudo apt-get update -qq || true
          fi
          for t in 1 2 3; do sudo apt-get install -y -qq --no-install-recommends --fix-missing libudev-dev libinput-dev libgbm-dev libseat-dev libxkbcommon-dev libegl-dev libgles-dev libdrm-dev libpixman-1-dev libwayland-dev libsystemd-dev pkg-config && break; sleep 15; sudo apt-get update -qq || true; done

      - name: Compilar
        working-directory: plumagem
        run: set -o pipefail; cargo build --release 2>&1 | tee ../compilacao.log

      - name: Erros (resumo)
        if: failure()
        run: |
          grep -E "^error" -A14 compilacao.log | head -400

      - name: Cargo.lock (para commit)
        if: always()
        run: |
          echo "::group::Cargo.lock"
          cat plumagem/Cargo.lock || true
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plumagem
          path: |
            plumagem/Cargo.lock
            plumagem/target/release/plumagem
          if-no-files-found: ignore

  # Auditoria: clippy, falhas conhecidas nas crates (RustSec) e quantos
  # blocos unsafe existem. Não impede o build; o resumo fica no run.
  auditoria:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Bibliotecas de sistema
        run: |
          # O espelho da Azure às vezes some do DNS: tenta de novo e, se não
          # der, usa o archive.ubuntu.com direto.
          for t in 1 2 3; do sudo apt-get update -qq && break; sleep 10; done
          if ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            sudo apt-get update -qq || true
          fi
          for t in 1 2 3; do sudo apt-get install -y -qq --no-install-recommends --fix-missing libudev-dev libinput-dev libgbm-dev libseat-dev libxkbcommon-dev libegl-dev libgles-dev libdrm-dev libpixman-1-dev libwayland-dev libsystemd-dev pkg-config && break; sleep 15; sudo apt-get update -qq || true; done

      - name: Clippy
        working-directory: plumagem
        run: |
          cargo clippy --release --locked 2>&1 | tee ../clippy.log || true
          {
            echo "## Clippy (plumagem)"
            echo
            echo '```'
            grep -E "^(warning|error)" ../clippy.log | sed 's/`[^`]*`/X/g' | sort | uniq -c | sort -rn | head -40
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: cargo-audit (RustSec)
        working-directory: plumagem
        run: |
          cargo install cargo-audit --locked -q
          cargo audit 2>&1 | tee ../audit.log || true
          {
            echo "## cargo-audit (plumagem)"
            echo
            echo '```'
            grep -E "^(Crate|Version|Title|ID|Solution|warning|error)" ../audit.log | head -80
            tail -3 ../audit.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: unsafe
        run: |
          {
            echo "## Blocos unsafe (plumagem)"
            echo
            echo '```'
            grep -rn --include=*.rs -E "unsafe *(\{|fn|impl)" plumagem | grep -v "/target/" | awk -F: '{print $1}' | sort | uniq -c | sort -rn
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
