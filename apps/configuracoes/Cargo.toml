[package]
name = "configuracoes"
version = "0.1.0"
description = "Configurações do Ararinha Azul Linux"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
penas = { path = "../penas" }
# Foto da conta: abre JPEG/PNG/WebP e grava ~/.face em PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[[bin]]
name = "configuracoes"
path = "src/main.rs"

# "Permitir esta alteração?": pede a senha de um administrador (UAC).
[[bin]]
name = "ararinha-admin"
path = "src/admin.rs"
