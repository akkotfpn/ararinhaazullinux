<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: CC-BY-SA-4.0 -->
<!-- Ararinha Azul Linux — logo oficial. Arte original do projeto. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Ararinha Azul Linux</title>
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B7BC4"/>
      <stop offset="1" stop-color="#0B2A4F"/>
    </linearGradient>
    <linearGradient id="corpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6AB4F0"/>
      <stop offset="1" stop-color="#2B7BC4"/>
    </linearGradient>
    <linearGradient id="asa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E5FA3"/>
      <stop offset="1" stop-color="#0E3F73"/>
    </linearGradient>
    <clipPath id="disco"><circle cx="128" cy="128" r="120"/></clipPath>
  </defs>

  <!-- Fundo: céu do sertão -->
  <circle cx="128" cy="128" r="120" fill="url(#ceu)"/>
  <g clip-path="url(#disco)">
    <!-- Sol dourado da caraibeira -->
    <circle cx="186" cy="78" r="30" fill="#E8B23A" opacity="0.9"/>
    <!-- Galho da caraibeira -->
    <path d="M10 190 C 70 176, 140 176, 250 160" stroke="#8A5A33" stroke-width="10"
          fill="none" stroke-linecap="round"/>
    <path d="M196 166 q 14 -16 34 -14" stroke="#8A5A33" stroke-width="6"
          fill="none" stroke-linecap="round"/>
    <ellipse cx="232" cy="150" rx="9" ry="5" fill="#E8B23A" transform="rotate(-20 232 150)"/>
    <ellipse cx="214" cy="146" rx="7" ry="4" fill="#E8B23A" transform="rotate(25 214 146)"/>

    <!-- Cauda longa -->
    <path d="M86 150 C 70 182, 56 214, 40 252 L 58 252 C 72 220, 90 188, 104 160 Z"
          fill="url(#asa)"/>
    <!-- Corpo -->
    <path d="M84 150 C 72 118, 90 84, 122 74 C 142 70, 156 82, 152 104
             C 148 132, 128 166, 104 174 C 94 176, 88 166, 84 150 Z"
          fill="url(#corpo)"/>
    <!-- Asa -->
    <path d="M96 116 C 112 104, 138 108, 140 124 C 138 146, 118 166, 98 172
             C 92 158, 90 132, 96 116 Z" fill="url(#asa)"/>
    <path d="M100 140 q 8 10 18 4 q 8 8 18 -2" stroke="#6AB4F0" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M98 156 q 8 9 16 3 q 7 6 14 -2" stroke="#6AB4F0" stroke-width="3"
          fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Pescoço: transição do azul para o cinza da cabeça -->
    <ellipse cx="134" cy="100" rx="20" ry="17" fill="#8DBDE6"/>
    <!-- Cabeça (cinza-azulada, típica da ararinha) -->
    <circle cx="140" cy="84" r="24" fill="#A9C6DC"/>
    <!-- Face nua escura ao redor do olho -->
    <ellipse cx="152" cy="82" rx="11" ry="9" fill="#3A4652"/>
    <circle cx="153" cy="81" r="4.5" fill="#F4F7FA"/>
    <circle cx="154" cy="81" r="2.2" fill="#0B1A2E"/>
    <!-- Bico curvo -->
    <path d="M160 82 C 176 78, 182 92, 174 104 C 170 98, 164 96, 158 96 Z"
          fill="#1E2630"/>
    <path d="M158 96 C 164 96, 168 100, 168 104 C 162 106, 156 102, 156 98 Z"
          fill="#2E3843"/>
    <!-- Pés no galho -->
    <path d="M110 172 l -4 10 M118 170 l 0 10" stroke="#3A4652" stroke-width="5"
          stroke-linecap="round"/>
  </g>
  <!-- Aro -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="#E8B23A" stroke-width="6"/>
</svg>
