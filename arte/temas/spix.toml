# Tema Spix — padrão do Ararinha Azul Linux (claro)
# Todos os componentes da Plumagem leem os tokens deste arquivo.

[tema]
id = "spix"
nome.pt-BR = "Spix"
nome.en = "Spix"
modo = "claro"
papel_de_parede = "papeis-de-parede/spix.svg"
sons = "grito-padrao"

[cores]
destaque          = "#2B7BC4"   # azul-ararinha
destaque_forte    = "#1E5FA3"
destaque_suave    = "#D6E8F7"
fundo             = "#F4F7FA"
superficie        = "#FFFFFF"
superficie_alta   = "#EAF0F5"
texto             = "#0B1A2E"
texto_secundario  = "#4A5A6A"
borda             = "#D3DDE6"
sucesso           = "#3E8E6A"   # verde Curaçá
aviso             = "#E8B23A"   # dourado caraibeira
erro              = "#C2413B"
barra_tarefas     = "#FFFFFFCC" # translúcida

[forma]
raio_pequeno = 6
raio_medio   = 10
raio_grande  = 16
espaco_base  = 4
sombra_janela = "0 8 24 #0B1A2E33"

[tipografia]
familia_interface = "Inter"
familia_mono      = "JetBrains Mono"
tamanho_base      = 10.5
