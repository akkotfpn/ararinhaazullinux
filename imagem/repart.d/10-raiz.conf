# Raiz do Ararinha (Fase 1: ext4 gravável; o layout A/B com EROFS e Btrfs
# entra com a Muda, ADR 0006). O kernel acha a raiz por PARTLABEL.
[Partition]
Type=root
Label=ararinha-raiz
Format=ext4
SizeMinBytes=8G
SizeMaxBytes=8G
GrowFileSystem=yes
CopyFiles=/:/
ExcludeFiles=/ferramentas
ExcludeFiles=/ninhada-obra
ExcludeFiles=/ninhada-destino
ExcludeFiles=/ninhada-substitutos
ExcludeFiles=/proc/
ExcludeFiles=/sys/
ExcludeFiles=/dev/
ExcludeFiles=/run/
ExcludeFiles=/tmp/
