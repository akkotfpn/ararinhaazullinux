# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 3: os aplicativos do Ararinha (ADR 0015), feitos com o kit Penas.
# Compilados dentro do próprio sistema, com as crates travadas no
# apps/Cargo.lock (baixadas e conferidas pela Ninhada).

[pacote]
nome      = "apps"
versao    = "0.1.0"
resumo    = "Aplicativos do Ararinha: Explorador, Imagens e Bloco de Notas"
licenca   = "GPL-3.0-or-later"
categoria = "apps"
tipo      = "toolchain"

[dependencias]
construcao = ["rust", "libxkbcommon", "wayland", "fonte-inter", "cifs-utils", "systemd", "alsa-lib", "libxcrypt"]

[construcao]
ambiente = "isolado"
copiar = ["apps"]
crates = "apps/Cargo.lock"
passos = [
  # Monta a pasta de crates no formato do `cargo vendor`.
  '''
mkdir -p ../vendor
for c in ../*.crate; do
  n=$(basename "$c" .crate)
  mkdir -p "../vendor/$n"
  tar -xzf "$c" -C "../vendor/$n" --strip-components=1 --no-same-owner
  printf '{"files":{},"package":"%s"}' "$(sha256sum "$c" | cut -d' ' -f1)" > "../vendor/$n/.cargo-checksum.json"
done
ls ../vendor | wc -l
''',
  '''
mkdir -p ../apps/.cargo
cat > ../apps/.cargo/config.toml << 'FIM'
[source.crates-io]
replace-with = "vendorizadas"

[source.vendorizadas]
directory = "../vendor"
FIM
''',
  '''
cd ../apps && RUSTFLAGS="--remap-path-prefix=$(cd .. && pwd)=/ararinha -C strip=symbols" CARGO_HOME=$PWD/../cargo-home cargo build --release --frozen --offline -j $NUCLEOS
''',
]
instalar = [
  '''
cd ../apps
install -vDm755 target/release/explorador /usr/bin/explorador
install -vDm644 explorador/recursos/explorador.desktop /usr/share/applications/explorador.desktop
install -vDm644 explorador/recursos/explorador.png /usr/share/icons/hicolor/64x64/apps/explorador.png
# Ajudante das unidades de rede: setuid root (ver apps/unidade).
install -vDm4755 target/release/ararinha-unidade /usr/bin/ararinha-unidade
# Tela de bloqueio: confere a senha da própria conta (setuid root).
install -vDm4755 target/release/ararinha-senha /usr/bin/ararinha-senha
# Planos de energia: sem setuid; quem chama como root é o ararinha-sistema
# (e o serviço do boot). Só escreve em arquivos fixos do /sys.
install -vDm755 target/release/ararinha-energia /usr/bin/ararinha-energia
install -vdm755 /usr/lib/systemd/system
# Serviço do sistema: ações de administrador por socket (SO_PEERCRED),
# no lugar de mais ajudantes setuid. Ativado só quando alguém pede.
install -vDm755 target/release/ararinha-sistema /usr/libexec/ararinha-sistema
install -vdm755 /etc/ararinha /var/lib/ararinha
cat > /usr/lib/systemd/system/ararinha-sistema.socket << 'FIM'
[Unit]
Description=Serviço do sistema do Ararinha (socket)

[Socket]
ListenStream=/run/ararinha/sistema.sock
SocketMode=0666
DirectoryMode=0755
Accept=no

[Install]
WantedBy=sockets.target
FIM
cat > /usr/lib/systemd/system/ararinha-sistema.service << 'FIM'
[Unit]
Description=Serviço do sistema do Ararinha
Requires=ararinha-sistema.socket

[Service]
ExecStart=/usr/libexec/ararinha-sistema
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ReadWritePaths=/etc/ararinha /var/lib/ararinha
ProtectHome=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=no
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
CapabilityBoundingSet=CAP_NET_ADMIN
RestrictAddressFamilies=AF_UNIX AF_NETLINK
FIM
systemctl enable ararinha-sistema.socket
cat > /usr/lib/systemd/system/ararinha-energia.service << 'FIM'
[Unit]
Description=Aplica o plano de energia escolhido nas Configurações

[Service]
Type=oneshot
ExecStart=/usr/bin/ararinha-energia aplicar
# Endurecimento: o serviço só enxerga e pode o mínimo.
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
CapabilityBoundingSet=
PrivateNetwork=yes
RestrictAddressFamilies=AF_UNIX

[Install]
WantedBy=multi-user.target
FIM
systemctl enable ararinha-energia.service
for app in imagens notas configuracoes central calculadora tarefas paciencia musicas instalador; do
  install -vDm755 target/release/$app /usr/bin/$app
  install -vDm644 $app/recursos/$app.desktop /usr/share/applications/$app.desktop
  install -vDm644 $app/recursos/$app.png /usr/share/icons/hicolor/64x64/apps/$app.png
done
install -vDm644 configuracoes/recursos/sobre.desktop /usr/share/applications/sobre.desktop
install -vDm755 target/release/painel-de-controle /usr/bin/painel-de-controle
install -vDm644 painel/recursos/painel-de-controle.desktop /usr/share/applications/painel-de-controle.desktop
install -vDm644 painel/recursos/painel-de-controle.png /usr/share/icons/hicolor/64x64/apps/painel-de-controle.png
install -vDm755 target/release/ararinha-som /usr/bin/ararinha-som
# Portais do Flatpak (Abrir/Salvar, tema, notificações) e notificações da sessão.
install -vDm755 target/release/xdg-desktop-portal-ararinha /usr/libexec/xdg-desktop-portal-ararinha
install -vDm644 portal/recursos/ararinha.portal /usr/share/xdg-desktop-portal/portals/ararinha.portal
install -vDm644 portal/recursos/org.freedesktop.impl.portal.desktop.ararinha.service /usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.ararinha.service
install -vDm644 portal/recursos/org.freedesktop.Notifications.service /usr/share/dbus-1/services/org.freedesktop.Notifications.service
install -vDm644 portal/recursos/org.freedesktop.FileManager1.service /usr/share/dbus-1/services/org.freedesktop.FileManager1.service
# Apps padrão (pastas no Explorador, imagens, textos e músicas nos nossos).
cat > /usr/share/applications/mimeapps.list << 'FIM'
[Default Applications]
inode/directory=explorador.desktop
image/png=imagens.desktop
image/jpeg=imagens.desktop
image/gif=imagens.desktop
image/webp=imagens.desktop
text/plain=notas.desktop
audio/mpeg=musicas.desktop
audio/flac=musicas.desktop
audio/ogg=musicas.desktop
FIM
# Instalador: o ajudante é setuid root e só obedece ao grupo wheel.
install -vDm4750 -g wheel target/release/ararinha-instalar /usr/bin/ararinha-instalar 2>/dev/null \
  || install -vDm4755 target/release/ararinha-instalar /usr/bin/ararinha-instalar
''',
]
