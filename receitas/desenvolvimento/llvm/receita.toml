# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 2: BLFS, LLVM (com Clang). Base dos drivers de vídeo das placas reais
# no Mesa (radeonsi, llvmpipe) e do compilador Rust do Ararinha.
# Diferenças do BLFS: sem compiler-rt e sem documentação; links limitados a
# dois por vez (o link do LLVM consome muita memória).

[pacote]
nome      = "llvm"
versao    = "23.1.0"
resumo    = "LLVM e Clang"
licenca   = "Apache-2.0 WITH LLVM-exception"
categoria = "desenvolvimento"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/llvm-project-23.1.0.src.tar.xz"

[dependencias]
construcao = ["cmake", "libffi", "python", "ninja", "zstd"]

[construcao]
ambiente = "isolado"
passos = [
  '''
grep -rl '#!.*python$' | xargs sed -i '1s/python$/python3/'
sed 's/utility/tool/' -i llvm/utils/FileCheck/CMakeLists.txt
''',
  '''
mkdir -p llvm/build && cd llvm/build && CC=gcc CXX=g++ cmake \
  -D CMAKE_INSTALL_PREFIX=/usr -D CMAKE_SKIP_INSTALL_RPATH=ON \
  -D LLVM_ENABLE_FFI=ON -D CMAKE_BUILD_TYPE=Release \
  -D LLVM_BUILD_LLVM_DYLIB=ON -D LLVM_LINK_LLVM_DYLIB=ON -D LLVM_ENABLE_RTTI=ON \
  -D LLVM_TARGETS_TO_BUILD="host;AMDGPU" -D LLVM_ENABLE_PROJECTS=clang \
  -D LLVM_BINUTILS_INCDIR=/usr/include -D LLVM_INCLUDE_BENCHMARKS=OFF \
  -D LLVM_INCLUDE_TESTS=OFF -D LLVM_INCLUDE_EXAMPLES=OFF \
  -D LLVM_PARALLEL_LINK_JOBS=2 \
  -D CLANG_DEFAULT_PIE_ON_LINUX=ON -D CLANG_CONFIG_FILE_SYSTEM_DIR=/etc/clang \
  -W no-author -G Ninja ..
''',
  '''
cd llvm/build && ninja -j$NUCLEOS
''',
]
instalar = [
  '''
cd llvm/build && ninja install
''',
  '''
mkdir -pv /etc/clang
for i in clang clang++; do echo -fstack-protector-strong > /etc/clang/$i.cfg; done
''',
]
