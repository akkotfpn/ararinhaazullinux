# Flatpak (aplicativos do Flathub): BLFS, cURL
# Compilado no ambiente isolado, sobre o sistema base.
# Diferença do BLFS: sem libpsl; usa o pacote de CAs do ca-certificates.

[pacote]
nome      = "curl"
versao    = "8.22.0"
resumo    = "Transferência de arquivos por URL (HTTPS)"
licenca   = "curl"
categoria = "flatpak"
tipo      = "toolchain"

[[fonte]]
url = "https://curl.se/download/curl-8.22.0.tar.xz"

[dependencias]
construcao = ["openssl", "zlib", "zstd", "ca-certificates"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --disable-static --with-openssl --without-libpsl --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt --with-ca-path=/etc/ssl/certs
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
