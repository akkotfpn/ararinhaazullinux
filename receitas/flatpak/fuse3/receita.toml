# SPDX-License-Identifier: GPL-3.0-or-later
# Flatpak (aplicativos do Flathub): BLFS, FUSE 3
# Compilado no ambiente isolado, sobre o sistema base.

[pacote]
nome      = "fuse3"
versao    = "3.18.3"
resumo    = "FUSE: sistemas de arquivos no espaço do usuário"
licenca   = "GPL-2.0-only AND LGPL-2.1-only"
categoria = "flatpak"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/libfuse/libfuse/releases/download/fuse-3.18.3/fuse-3.18.3.tar.gz"

[dependencias]
construcao = ["meson"]

[construcao]
ambiente = "isolado"
passos = [
  '''
sed -i '/^udev/,$ s/^/#/' util/meson.build
''',
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D examples=false -D tests=false ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
chmod u+s /usr/bin/fusermount3
''',
]
