# SPDX-License-Identifier: GPL-3.0-or-later
# Flatpak (aplicativos do Flathub): BLFS, JSON-GLib
# Compilado no ambiente isolado, sobre o sistema base.

[pacote]
nome      = "json-glib"
versao    = "1.10.8"
resumo    = "JSON para GLib"
licenca   = "LGPL-2.1-or-later"
categoria = "flatpak"
tipo      = "toolchain"

[[fonte]]
url = "https://download.gnome.org/sources/json-glib/1.10/json-glib-1.10.8.tar.xz"

[dependencias]
construcao = ["glib", "meson"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D introspection=disabled -D documentation=disabled -D man=false -D tests=false ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
