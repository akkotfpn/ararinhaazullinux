# SPDX-License-Identifier: GPL-3.0-or-later
# Flatpak (aplicativos do Flathub): BLFS, libgcrypt
# Compilado no ambiente isolado, sobre o sistema base.

[pacote]
nome      = "libgcrypt"
versao    = "1.12.4"
resumo    = "Criptografia do GnuPG"
licenca   = "LGPL-2.1-or-later"
categoria = "flatpak"
tipo      = "toolchain"

[[fonte]]
url = "https://www.gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-1.12.4.tar.bz2"

[dependencias]
construcao = ["libgpg-error"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --disable-static
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
