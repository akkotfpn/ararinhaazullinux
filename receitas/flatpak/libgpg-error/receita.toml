# SPDX-License-Identifier: GPL-3.0-or-later
# Flatpak (aplicativos do Flathub): BLFS, libgpg-error
# Compilado no ambiente isolado, sobre o sistema base.

[pacote]
nome      = "libgpg-error"
versao    = "1.61"
resumo    = "Erros comuns do GnuPG"
licenca   = "LGPL-2.1-or-later"
categoria = "flatpak"
tipo      = "toolchain"

[[fonte]]
url = "https://www.gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.61.tar.bz2"

[dependencias]
construcao = []

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --disable-static
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
