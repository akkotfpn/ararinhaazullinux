# Flatpak (aplicativos do Flathub): BLFS, libxml2
# Diferença do BLFS: sem o módulo Python (na 2.15 ele exige doxygen).
# Compilado no ambiente isolado, sobre o sistema base.

[pacote]
nome      = "libxml2"
versao    = "2.15.4"
resumo    = "Biblioteca de XML"
licenca   = "MIT"
categoria = "flatpak"
tipo      = "toolchain"

[[fonte]]
url = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz"

[dependencias]
construcao = ["meson", "python", "readline"]

[construcao]
ambiente = "isolado"
passos = [
  '''
sed -i "/'git'/,+3d" meson.build
''',
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D history=enabled -D icu=disabled -D python=disabled -D docs=disabled ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
