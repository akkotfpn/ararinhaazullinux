# SPDX-License-Identifier: GPL-3.0-or-later
# Flatpak (aplicativos do Flathub): BLFS, libxmlb
# Compilado no ambiente isolado, sobre o sistema base.

[pacote]
nome      = "libxmlb"
versao    = "0.3.29"
resumo    = "XML binário rápido (usado pelo AppStream)"
licenca   = "LGPL-2.1-or-later"
categoria = "flatpak"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/hughsie/libxmlb/releases/download/0.3.29/libxmlb-0.3.29.tar.xz"

[dependencias]
construcao = ["glib", "meson", "xz", "zstd"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D gtkdoc=false -D introspection=false -D tests=false ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
