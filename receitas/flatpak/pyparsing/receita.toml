# SPDX-License-Identifier: GPL-3.0-or-later
# Flatpak (aplicativos do Flathub): módulo Python (PyPI)
# Compilado no ambiente isolado, sobre o sistema base.

[pacote]
nome      = "pyparsing"
versao    = "3.2.5"
resumo    = "Módulo Python pyparsing (usado na compilação do Flatpak)"
licenca   = "MIT"
categoria = "flatpak"
tipo      = "toolchain"

[[fonte]]
url = "https://files.pythonhosted.org/packages/source/p/pyparsing/pyparsing-3.2.5.tar.gz"

[dependencias]
construcao = ["flit-core", "wheel"]

[construcao]
ambiente = "isolado"
passos = [
  '''
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
''',
]
instalar = [
  '''
pip3 install --no-index --force-reinstall --no-deps --find-links dist pyparsing
''',
]
