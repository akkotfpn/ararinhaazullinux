# SPDX-License-Identifier: GPL-3.0-or-later
# Flatpak (aplicativos do Flathub): BLFS, xdg-dbus-proxy
# Compilado no ambiente isolado, sobre o sistema base.

[pacote]
nome      = "xdg-dbus-proxy"
versao    = "0.1.9"
resumo    = "Filtro de D-Bus para a caixa de areia"
licenca   = "LGPL-2.1-or-later"
categoria = "flatpak"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/flatpak/xdg-dbus-proxy/releases/download/0.1.9/xdg-dbus-proxy-0.1.9.tar.xz"

[dependencias]
construcao = ["glib", "meson"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D man=disabled ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
