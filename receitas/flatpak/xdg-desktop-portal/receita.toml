# SPDX-License-Identifier: GPL-3.0-or-later
# Flatpak (aplicativos do Flathub): BLFS, xdg-desktop-portal
# Os "portais" deixam os apps da caixa de areia abrir e salvar arquivos,
# abrir links, mandar notificações e saber se o tema é escuro. A parte que
# desenha (o "backend") é nossa: xdg-desktop-portal-ararinha, nos apps.

[pacote]
nome      = "xdg-desktop-portal"
versao    = "1.22.1"
resumo    = "Portais do Flatpak (arquivos, links, notificações)"
licenca   = "LGPL-2.1-or-later"
categoria = "flatpak"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/flatpak/xdg-desktop-portal/releases/download/1.22.1/xdg-desktop-portal-1.22.1.tar.xz"

[dependencias]
construcao = ["glib", "meson", "fuse3", "gdk-pixbuf", "json-glib", "pipewire", "bubblewrap", "dbus", "systemd"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback \
  -D tests=disabled -D documentation=disabled -D man-pages=disabled ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
  # A Plumagem (XDG_CURRENT_DESKTOP=Plumagem) usa o backend do Ararinha.
  '''
install -vdm755 /usr/share/xdg-desktop-portal
cat > /usr/share/xdg-desktop-portal/plumagem-portals.conf << 'FIM'
[preferred]
default=ararinha
FIM
''',
]
