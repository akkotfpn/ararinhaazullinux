# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 2, base gráfica: BLFS, Cairo (sem X11)
# Compilado no ambiente isolado, sobre o sistema base da Fase 1.

[pacote]
nome      = "cairo"
versao    = "1.18.6"
resumo    = "Desenho vetorial 2D"
licenca   = "LGPL-2.1-only OR MPL-1.1"
categoria = "grafico"
tipo      = "toolchain"

[[fonte]]
url = "https://www.cairographics.org/releases/cairo-1.18.6.tar.xz"

[dependencias]
construcao = ["pixman", "fontconfig", "libpng"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D xlib=disabled -D xcb=disabled -D glib=disabled -D tests=disabled -D spectre=disabled -D lzo=disabled ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
