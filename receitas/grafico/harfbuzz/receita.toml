# Fase 2, base gráfica: BLFS, HarfBuzz
# Compilado no ambiente isolado, sobre o sistema base da Fase 1.

[pacote]
nome      = "harfbuzz"
versao    = "14.5.0"
resumo    = "Moldagem de texto (acentos, ligaduras)"
licenca   = "MIT"
categoria = "grafico"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/harfbuzz/harfbuzz/releases/download/14.5.0/harfbuzz-14.5.0.tar.xz"

[dependencias]
construcao = ["freetype", "meson"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D freetype=enabled -D glib=disabled -D gobject=disabled -D icu=disabled -D cairo=disabled -D graphite2=disabled -D introspection=disabled -D tests=disabled -D docs=disabled ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
