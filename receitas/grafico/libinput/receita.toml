# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 2, base gráfica: BLFS, libinput
# Compilado no ambiente isolado, sobre o sistema base da Fase 1.

[pacote]
nome      = "libinput"
versao    = "1.32.0"
resumo    = "Teclado, mouse e touchpad para o compositor"
licenca   = "MIT"
categoria = "grafico"
tipo      = "toolchain"

[[fonte]]
url = "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.32.0/libinput-1.32.0.tar.gz"

[dependencias]
construcao = ["libevdev", "mtdev"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D debug-gui=false -D tests=false -D libwacom=false -D documentation=false -D udev-dir=/usr/lib/udev ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
