# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 2, base gráfica: BLFS, módulos Python (Mako)
# Compilado no ambiente isolado, sobre o sistema base da Fase 1.

[pacote]
nome      = "mako"
versao    = "1.4.3"
resumo    = "Modelos em Python (gera código do Mesa)"
licenca   = "MIT"
categoria = "grafico"
tipo      = "toolchain"

[[fonte]]
url = "https://files.pythonhosted.org/packages/source/M/Mako/mako-1.4.3.tar.gz"

[dependencias]
construcao = ["markupsafe", "setuptools"]

[construcao]
ambiente = "isolado"
passos = [
  '''
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
''',
]
instalar = [
  '''
pip3 install --no-index --force-reinstall --no-deps --find-links dist Mako
''',
]
