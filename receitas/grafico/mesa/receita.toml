# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 2, base gráfica: BLFS, Mesa
# Compilado no ambiente isolado, sobre o sistema base da Fase 1.
# Drivers Gallium: llvmpipe (desenho por CPU rápido, com LLVM; é o que a VM
# usa), softpipe (reserva), virgl (3D em VM), radeonsi/r600/r300 (AMD),
# nouveau (NVIDIA) e svga (VMware). Ainda faltam: iris/crocus (Intel) e
# o Vulkan, que pedem libclc, SPIRV-LLVM-Translator e glslang.

[pacote]
nome      = "mesa"
versao    = "26.2.3"
resumo    = "Mesa: OpenGL, EGL e GBM"
licenca   = "MIT"
categoria = "grafico"
tipo      = "toolchain"

[[fonte]]
url = "https://archive.mesa3d.org/mesa-26.2.3.tar.xz"

[dependencias]
construcao = ["libdrm", "wayland-protocols", "mako", "pyyaml", "packaging", "zstd", "libelf", "llvm", "libx11", "libxcb", "libxext", "libxfixes", "libxxf86vm", "libxrandr", "libxshmfence"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D platforms=x11,wayland -D gallium-drivers=llvmpipe,softpipe,virgl,radeonsi,r600,r300,nouveau,svga,iris,crocus -D vulkan-drivers= -D llvm=enabled -D shared-llvm=enabled -D glx=dri -D glvnd=disabled -D gles1=disabled -D valgrind=disabled -D libunwind=disabled -D video-codecs= -D build-tests=false ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
