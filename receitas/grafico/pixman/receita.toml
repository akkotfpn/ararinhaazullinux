# Fase 2, base gráfica: BLFS, Pixman
# Compilado no ambiente isolado, sobre o sistema base da Fase 1.

[pacote]
nome      = "pixman"
versao    = "0.46.4"
resumo    = "Rasterização de pixels (desenho por software)"
licenca   = "MIT"
categoria = "grafico"
tipo      = "toolchain"

[[fonte]]
url = "https://www.cairographics.org/releases/pixman-0.46.4.tar.gz"

[dependencias]
construcao = ["meson", "libpng"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D tests=disabled -D demos=disabled -D gtk=disabled ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
