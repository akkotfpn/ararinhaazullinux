# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 2, base gráfica: BLFS, módulos Python (PyYAML)
# Compilado no ambiente isolado, sobre o sistema base da Fase 1.
# Sem Cython nem libyaml: o PyYAML usa a versão em Python puro.

[pacote]
nome      = "pyyaml"
versao    = "6.0.3"
resumo    = "Leitor de YAML para Python (usado pelo Mesa)"
licenca   = "MIT"
categoria = "grafico"
tipo      = "toolchain"

[[fonte]]
url = "https://files.pythonhosted.org/packages/source/P/PyYAML/pyyaml-6.0.3.tar.gz"

[dependencias]
construcao = ["setuptools", "wheel"]

[construcao]
ambiente = "isolado"
passos = [
  '''
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
''',
]
instalar = [
  '''
pip3 install --no-index --force-reinstall --no-deps --find-links dist PyYAML
''',
]
