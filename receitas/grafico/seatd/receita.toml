# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 2, base gráfica: BLFS, seatd (só a libseat, sobre o systemd-logind)
# Compilado no ambiente isolado, sobre o sistema base da Fase 1.

[pacote]
nome      = "seatd"
versao    = "0.9.3"
resumo    = "libseat: acesso à tela e ao teclado via systemd-logind"
licenca   = "MIT"
categoria = "grafico"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/kennylevinsen/seatd/archive/0.9.3/seatd-0.9.3.tar.gz"

[dependencias]
construcao = ["meson", "systemd"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D server=disabled -D libseat-seatd=disabled -D libseat-logind=systemd -D libseat-builtin=disabled -D man-pages=disabled ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
