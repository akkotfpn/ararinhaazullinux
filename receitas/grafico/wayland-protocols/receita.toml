# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 2, base gráfica: BLFS, Wayland-Protocols
# Compilado no ambiente isolado, sobre o sistema base da Fase 1.

[pacote]
nome      = "wayland-protocols"
versao    = "1.49"
resumo    = "Extensões do protocolo Wayland"
licenca   = "MIT"
categoria = "grafico"
tipo      = "toolchain"

[[fonte]]
url = "https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.49/downloads/wayland-protocols-1.49.tar.xz"

[dependencias]
construcao = ["wayland"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D tests=false ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
