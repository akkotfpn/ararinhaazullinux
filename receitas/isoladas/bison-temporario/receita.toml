# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 7 (livro r13.1-39-systemd): roda DENTRO da raiz em construção.
# No LFS isso é um chroot como root; aqui é o ambiente isolado da Ninhada
# (namespaces de usuário, sem nenhum privilégio real na máquina de build).

[pacote]
nome      = "bison-temporario"
versao    = "3.8.2"
resumo    = "Gerador de analisadores (temporário)"
licenca   = "GPL-3.0-or-later"
categoria = "isoladas"
tipo      = "toolchain"

[fonte]
url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz"

[dependencias]
construcao = ["preparar-isolado"]

[construcao]
ambiente = "isolado"
passos = [
  "./configure --prefix=/usr --docdir=/usr/share/doc/bison-3.8.2",
  "make",
]
instalar = [
  "make install",
]
