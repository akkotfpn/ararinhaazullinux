# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 7 (livro r13.1-39-systemd): roda DENTRO da raiz em construção.
# No LFS isso é um chroot como root; aqui é o ambiente isolado da Ninhada
# (namespaces de usuário, sem nenhum privilégio real na máquina de build).

[pacote]
nome      = "gettext-temporario"
versao    = "1.0"
resumo    = "Ferramentas de tradução (msgfmt, msgmerge, xgettext; temporário)"
licenca   = "GPL-3.0-or-later"
categoria = "isoladas"
tipo      = "toolchain"

[fonte]
url = "https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.xz"

[dependencias]
construcao = ["preparar-isolado"]

[construcao]
ambiente = "isolado"
passos = [
  "./configure --disable-shared",
  "make",
]
instalar = [
  "cp -v gettext-tools/src/{msgfmt,msgmerge,xgettext} /usr/bin",
]
