# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 7 (livro r13.1-39-systemd): roda DENTRO da raiz em construção.
# No LFS isso é um chroot como root; aqui é o ambiente isolado da Ninhada
# (namespaces de usuário, sem nenhum privilégio real na máquina de build).

[pacote]
nome      = "util-linux-temporario"
versao    = "2.42.4"
resumo    = "Utilitários de sistema (temporário)"
licenca   = "GPL-2.0-or-later"
categoria = "isoladas"
tipo      = "toolchain"

[fonte]
url = "https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.4.tar.xz"

[dependencias]
construcao = ["preparar-isolado"]

[construcao]
ambiente = "isolado"
passos = [
  "mkdir -pv /var/lib/hwclock",
  """
  ./configure --libdir=/usr/lib     \
              --runstatedir=/run    \
              --disable-chfn-chsh   \
              --disable-login       \
              --disable-nologin     \
              --disable-su          \
              --disable-setpriv     \
              --disable-runuser     \
              --disable-pylibmount  \
              --disable-static      \
              --disable-liblastlog2 \
              --without-python      \
              ADJTIME_PATH=/var/lib/hwclock/adjtime \
              --docdir=/usr/share/doc/util-linux-2.42.4
  """,
  "make",
]
instalar = [
  "make install",
]
