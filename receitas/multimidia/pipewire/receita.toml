# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 2, som: BLFS, PipeWire
# Compilado no ambiente isolado, sobre o sistema base da Fase 1.
# Diferença do BLFS: sem Bluetooth, câmera, JACK, GStreamer e X11 por enquanto.

[pacote]
nome      = "pipewire"
versao    = "1.6.9"
resumo    = "PipeWire: servidor de som e vídeo"
licenca   = "MIT"
categoria = "multimidia"
tipo      = "toolchain"

[[fonte]]
url = "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.6.9/pipewire-1.6.9.tar.bz2"

[dependencias]
construcao = ["meson", "alsa-lib", "dbus", "systemd", "readline"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback -D session-managers=[] -D examples=disabled -D tests=disabled -D man=disabled -D docs=disabled -D gstreamer=disabled -D jack=disabled -D pipewire-jack=disabled -D bluez5=disabled -D libcamera=disabled -D x11=disabled -D x11-xfixes=disabled -D avahi=disabled -D sndfile=disabled -D libpulse=disabled -D roc=disabled -D vulkan=disabled -D selinux=disabled -D pipewire-alsa=enabled ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
  # Programas que falam ALSA (como o app Músicas) saem pelo PipeWire.
  '''
install -vdm755 /etc/alsa/conf.d
for c in 50-pipewire.conf 99-pipewire-default.conf; do
  [ -f /usr/share/alsa/alsa.conf.d/$c ] && ln -sfv /usr/share/alsa/alsa.conf.d/$c /etc/alsa/conf.d/$c
done
true
''',
]
