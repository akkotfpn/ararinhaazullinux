# SPDX-License-Identifier: GPL-3.0-or-later
# Terminal provisório da Plumagem (Super+Enter), até o Terminal próprio do
# Ararinha (ADR 0015) existir. Só Wayland, sem X11.
#
# O Cargo.lock ao lado é cópia exata do que vem na tag v0.17.0; a Ninhada
# baixa e confere cada crate por ele.

[pacote]
nome      = "alacritty"
versao    = "0.17.0"
resumo    = "Terminal Alacritty"
licenca   = "Apache-2.0 OR MIT"
categoria = "plumagem"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/alacritty/alacritty/archive/v0.17.0/alacritty-0.17.0.tar.gz"

[dependencias]
construcao = ["rust", "fontconfig", "freetype", "libxkbcommon", "wayland", "mesa", "fonte-jetbrains-mono"]

[construcao]
ambiente = "isolado"
crates = "receitas/plumagem/alacritty/Cargo.lock"
passos = [
  '''
mkdir -p ../vendor
for c in ../*.crate; do
  n=$(basename "$c" .crate)
  mkdir -p "../vendor/$n"
  tar -xzf "$c" -C "../vendor/$n" --strip-components=1 --no-same-owner
  printf '{"files":{},"package":"%s"}' "$(sha256sum "$c" | cut -d' ' -f1)" > "../vendor/$n/.cargo-checksum.json"
done
''',
  '''
mkdir -p .cargo
cat > .cargo/config.toml << 'FIM'
[source.crates-io]
replace-with = "vendorizadas"

[source.vendorizadas]
directory = "../vendor"
FIM
''',
  '''
CARGO_HOME=$PWD/../cargo-home cargo build --release --frozen --offline -j $NUCLEOS \
  -p alacritty --no-default-features --features wayland
''',
]
instalar = [
  '''
install -vDm755 target/release/alacritty /usr/bin/alacritty
install -vDm644 extra/linux/Alacritty.desktop /usr/share/applications/Alacritty.desktop
install -vDm644 extra/logo/alacritty-term.svg /usr/share/pixmaps/Alacritty.svg
install -vDm644 extra/logo/compat/alacritty-term.png /usr/share/icons/hicolor/64x64/apps/Alacritty.png
tic -xe alacritty,alacritty-direct extra/alacritty.info
''',
  # Fonte padrão: JetBrains Mono.
  '''
install -vdm755 /etc/xdg/alacritty
cat > /etc/xdg/alacritty/alacritty.toml << 'FIM'
[font]
normal = { family = "JetBrains Mono" }
size = 11.0

[window]
padding = { x = 8, y = 8 }
FIM
''',
]
