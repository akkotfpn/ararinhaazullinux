# SPDX-License-Identifier: GPL-3.0-or-later
# Fase 2: a Plumagem, compositor Wayland do Ararinha (ADR 0004), compilada
# dentro do próprio sistema com o Rust do Ararinha e sem rede.
#
# As crates vêm do plumagem/Cargo.lock: a Ninhada baixa cada uma do
# crates.io e confere o SHA-256 registrado no Cargo.lock antes do build.

[pacote]
nome      = "plumagem"
versao    = "0.1.0"
resumo    = "Plumagem: compositor e shell gráfico do Ararinha"
licenca   = "GPL-3.0-or-later AND MIT"
categoria = "plumagem"
tipo      = "toolchain"

[dependencias]
construcao = ["rust", "mesa", "libinput", "seatd", "libxkbcommon", "pixman", "wayland", "libdrm", "systemd", "libxcrypt", "shadow", "wireplumber"]

[construcao]
ambiente = "isolado"
copiar = ["plumagem"]
crates = "plumagem/Cargo.lock"
passos = [
  # Monta a pasta de crates no formato do `cargo vendor`.
  '''
mkdir -p ../vendor
for c in ../*.crate; do
  n=$(basename "$c" .crate)
  mkdir -p "../vendor/$n"
  tar -xzf "$c" -C "../vendor/$n" --strip-components=1 --no-same-owner
  printf '{"files":{},"package":"%s"}' "$(sha256sum "$c" | cut -d' ' -f1)" > "../vendor/$n/.cargo-checksum.json"
done
ls ../vendor | wc -l
''',
  '''
mkdir -p ../plumagem/.cargo
cat > ../plumagem/.cargo/config.toml << 'FIM'
[source.crates-io]
replace-with = "vendorizadas"

[source.vendorizadas]
directory = "../vendor"
FIM
''',
  '''
cd ../plumagem && RUSTFLAGS="--remap-path-prefix=$(cd .. && pwd)=/ararinha -C strip=symbols" CARGO_HOME=$PWD/../cargo-home cargo build --release --frozen --offline -j $NUCLEOS
''',
]
instalar = [
  '''
install -vDm755 ../plumagem/target/release/plumagem /usr/bin/plumagem
plumagem --versao
''',
  # Lançador da sessão. Sem PAM, o login ainda não abre sessão no logind:
  # a pasta de runtime é criada aqui e, como root, o acesso à tela e ao
  # teclado usa o backend embutido da libseat.
  '''
cat > /usr/bin/plumagem-sessao << 'FIM'
#!/bin/sh
# Inicia a Plumagem no terminal atual (tty1, tty2...).
: "${XDG_RUNTIME_DIR:=/run/user/$(id -u)}"
export XDG_RUNTIME_DIR
mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
if [ -z "$XDG_SESSION_ID" ] && [ "$(id -u)" = 0 ]; then
  export LIBSEAT_BACKEND="${LIBSEAT_BACKEND:-builtin}"
fi
export XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=Plumagem
# Idioma do sistema (Configurações › Idioma e teclado grava no locale.conf).
[ -r /etc/locale.conf ] && . /etc/locale.conf && export LANG
# Barramento D-Bus da sessão (o som e os apps usam).
if [ -z "$DBUS_SESSION_BUS_ADDRESS" ] && command -v dbus-run-session >/dev/null; then
  exec dbus-run-session -- "$0" "$@"
fi
# Flatpak: apps instalados (do usuário e do sistema) no menu, e o Flathub
# configurado para o usuário na primeira sessão.
if command -v flatpak >/dev/null; then
  export XDG_DATA_DIRS="$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
  flatpak remote-add --user --if-not-exists flathub /usr/share/flatpak/flathub.flatpakrepo >/dev/null 2>&1 &
  # A Plumagem é só Wayland (sem X): Chromium e apps Electron usam o Wayland.
  if [ ! -f "$HOME/.local/share/flatpak/overrides/global" ] || ! grep -q OZONE "$HOME/.local/share/flatpak/overrides/global" 2>/dev/null; then
    flatpak override --user --env=ELECTRON_OZONE_PLATFORM_HINT=auto >/dev/null 2>&1 &
  fi
  # Apps GTK e o Chromium desenham a própria barra de título: botões de
  # minimizar, maximizar e fechar à direita, como no Windows.
  for v in 3.0 4.0; do
    if [ ! -e "$HOME/.config/gtk-$v/settings.ini" ]; then
      mkdir -p "$HOME/.config/gtk-$v"
      printf '[Settings]\ngtk-decoration-layout=:minimize,maximize,close\ngtk-font-name=Inter 10\n' > "$HOME/.config/gtk-$v/settings.ini"
    fi
  done
  # Primeiro login: atalho da Central de Apps na área de trabalho e o
  # Chromium instalado sozinho (em segundo plano, com prioridade baixa).
  marca="$HOME/.config/ararinha/primeiro-login"
  if [ ! -f "$marca" ]; then
    mkdir -p "$HOME/.config/ararinha" "$HOME/Área de Trabalho"
    cp /usr/share/applications/central.desktop "$HOME/Área de Trabalho/" 2>/dev/null
    touch "$marca"
    (
      sleep 8
      ararinha-notificar "Instalando o Chromium" "O navegador chega em alguns minutos; ele aparece no menu Iniciar."
      if nice -n 15 flatpak install --user -y --noninteractive flathub org.chromium.Chromium >/dev/null 2>&1; then
        mkdir -p "$HOME/Área de Trabalho"
        for d in "$HOME/.local/share/flatpak/exports/share/applications/org.chromium.Chromium.desktop" /var/lib/flatpak/exports/share/applications/org.chromium.Chromium.desktop; do
          if [ -e "$d" ]; then cp "$d" "$HOME/Área de Trabalho/"; break; fi
        done
        ararinha-notificar "Chromium pronto" "O navegador já está no menu Iniciar e na área de trabalho."
      else
        ararinha-notificar "Chromium não foi instalado" "Sem internet? Instale depois pela Central de Apps."
      fi
    ) &
  fi
  for app in org.chromium.Chromium com.google.Chrome com.brave.Browser; do
    f="$HOME/.var/app/$app/config/chromium-flags.conf"
    [ "$app" = com.google.Chrome ] && f="$HOME/.var/app/$app/config/chrome-flags.conf"
    [ "$app" = com.brave.Browser ] && f="$HOME/.var/app/$app/config/brave-flags.conf"
    if [ ! -f "$f" ]; then
      mkdir -p "$(dirname "$f")" && printf '%s\n' --ozone-platform-hint=auto --enable-features=WaylandWindowDecorations > "$f"
    fi
  done
fi
# Unidades de rede marcadas para reconectar ao entrar.
if [ -s "$HOME/.config/ararinha/unidades" ] && command -v explorador >/dev/null; then
  explorador --reconectar >>"$XDG_RUNTIME_DIR/unidades.log" 2>&1 &
fi
# Som: PipeWire, WirePlumber e o servidor compatível com PulseAudio.
pids=
if command -v pipewire >/dev/null; then
  for p in pipewire-pulse wireplumber pipewire; do pkill -u "$(id -u)" -x "$p" 2>/dev/null; done
  pipewire >>"$XDG_RUNTIME_DIR/som.log" 2>&1 & pids="$pids $!"
  sleep 0.3
  wireplumber >>"$XDG_RUNTIME_DIR/som.log" 2>&1 & pids="$pids $!"
  pipewire-pulse >>"$XDG_RUNTIME_DIR/som.log" 2>&1 & pids="$pids $!"
  # O som de "sessão iniciada", quando o PipeWire já estiver de pé.
  if command -v ararinha-som >/dev/null; then
    (sleep 1.5; ararinha-som /usr/share/sounds/ararinha/sessao-iniciada.wav) >/dev/null 2>&1 &
  fi
fi
# Bandeja do sistema (ícones da Steam, Discord...), antes dos apps.
if [ -x /usr/libexec/ararinha-bandeja ]; then
  /usr/libexec/ararinha-bandeja 2>>"$XDG_RUNTIME_DIR/bandeja.log" & pids="$pids $!"
fi
plumagem "$@" 2>>"$XDG_RUNTIME_DIR/plumagem.log"
estado=$?
[ -n "$pids" ] && kill $pids 2>/dev/null
exit $estado
FIM
chmod 755 /usr/bin/plumagem-sessao
''',
  # Configuração da Plumagem.
  '''
install -vdm755 /etc/plumagem
# Papéis de parede (o Spix vem embutido na Plumagem e também fica aqui).
install -vdm755 /usr/share/backgrounds/ararinha
install -vm644 ../plumagem/resources/fundo-spix.png /usr/share/backgrounds/ararinha/spix.png
install -vm644 ../plumagem/resources/papeis/*.png /usr/share/backgrounds/ararinha/
# Sons do sistema (sintetizados por ferramentas/arte/sintetizar-sons.py).
# Bloqueia a tela antes de suspender (pelo FIFO de controle da Plumagem).
install -vdm755 /usr/lib/systemd/system-sleep
cat > /usr/lib/systemd/system-sleep/ararinha-bloquear << 'FIM'
#!/bin/sh
[ "$1" = pre ] || exit 0
for f in /run/user/*/plumagem-ctl; do
  [ -p "$f" ] && timeout 1 sh -c "echo bloquear > '$f'"
done
sleep 0.4
exit 0
FIM
chmod 755 /usr/lib/systemd/system-sleep/ararinha-bloquear
install -vdm755 /usr/share/sounds/ararinha
install -vm644 ../plumagem/resources/sons/*.wav /usr/share/sounds/ararinha/
# ararinha-notificar "Título" "Texto": mostra uma notificação na Plumagem.
cat > /usr/bin/ararinha-notificar << 'FIM'
#!/bin/sh
# Mostra uma notificação no canto da tela (Plumagem).
[ -n "$1" ] || { echo "uso: ararinha-notificar \"Título\" [\"Texto\"]" >&2; exit 2; }
d="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/ararinha-avisos"
mkdir -p "$d" && chmod 700 "$d"
t="$d/.$$.tmp"
printf '%s\n%s\n' "$1" "$2" > "$t" && mv "$t" "$d/$(date +%s%N).txt"
FIM
chmod 755 /usr/bin/ararinha-notificar
cat > /etc/plumagem/plumagem.conf << 'FIM'
# Configuração da Plumagem (vale para todos os usuários; cada um pode ter a
# sua em ~/.config/plumagem/plumagem.conf). Mudanças valem ao reabrir a sessão.

# Tamanho da barra de tarefas: pequena, media ou grande (ou a altura em pixels).
barra = media

# Papel de parede: spix, noite-no-sertao, velho-chico, aero-azul,
# caatinga-em-flor (de /usr/share/backgrounds/ararinha) ou o caminho de um PNG.
papel = spix

# Modo de cor da interface e dos aplicativos: claro ou escuro.
tema = claro

# Sons do sistema (entrar, notificação, desligar): sim ou nao.
sons = sim
FIM
rm -f /etc/profile.d/plumagem.sh
''',
  # Ninho: a tela de entrada no tty1. O seatd dá às sessões dos usuários
  # (grupo "seat") acesso à tela e ao teclado, sem precisar de PAM/logind.
  # Para voltar ao login de texto: systemctl disable --now ninho e
  # systemctl unmask getty@tty1.
  '''
getent group seat >/dev/null || groupadd -r seat
cat > /usr/bin/ninho << 'FIM'
#!/bin/sh
# Ninho: abre a Plumagem como tela de entrada; com a senha certa, abre a
# sessão do usuário escolhido. Quando a sessão termina, o systemd reinicia
# o Ninho.
export XDG_RUNTIME_DIR=/run/ninho XDG_SESSION_TYPE=wayland LIBSEAT_BACKEND=seatd
mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
rm -f "$XDG_RUNTIME_DIR/escolha"
plumagem --ninho 2>>/var/log/ninho.log
u=$(cat "$XDG_RUNTIME_DIR/escolha" 2>/dev/null) || exit 1
rm -f "$XDG_RUNTIME_DIR/escolha"
uid=$(id -u "$u") || exit 1
dir=/run/user/$uid
mkdir -p "$dir" && chown "$u:" "$dir" && chmod 700 "$dir"
exec su -l "$u" -c plumagem-sessao
FIM
chmod 755 /usr/bin/ninho
cat > /usr/lib/systemd/system/seatd.service << 'FIM'
[Unit]
Description=seatd: acesso à tela e ao teclado para as sessões gráficas
Documentation=man:seatd(1)

[Service]
ExecStart=/usr/bin/seatd -g seat
Restart=always

[Install]
WantedBy=multi-user.target
FIM
cat > /usr/lib/systemd/system/ninho.service << 'FIM'
[Unit]
Description=Ninho: tela de entrada do Ararinha
Wants=seatd.service
After=seatd.service systemd-user-sessions.service systemd-logind.service

[Service]
ExecStart=/usr/bin/ninho
Restart=always
RestartSec=1
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes

[Install]
WantedBy=multi-user.target
Alias=display-manager.service
FIM
systemctl enable seatd.service ninho.service
systemctl mask getty@tty1.service
''',
]
