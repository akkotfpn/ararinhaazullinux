# SPDX-License-Identifier: GPL-3.0-or-later
# Segurança (firewall): BLFS, nftables
# O firewall do Ararinha: nada entra sem ter sido pedido (como o Firewall
# do Windows no perfil "rede pública"); tudo o que sai é liberado.

[pacote]
nome      = "nftables"
versao    = "1.1.7"
resumo    = "Firewall (nft) com as regras do Ararinha"
licenca   = "GPL-2.0-only"
categoria = "rede"
tipo      = "toolchain"

[[fonte]]
url = "https://www.netfilter.org/projects/nftables/files/nftables-1.1.7.tar.xz"

[dependencias]
construcao = ["libmnl", "libnftnl", "systemd"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --disable-debug --disable-man-doc \
            --disable-python --without-cli --without-json
''',
  '''
make -j$NUCLEOS
''',
]
instalar = [
  '''
make install
''',
  '''
cat > /etc/nftables.conf << 'FIM'
#!/usr/sbin/nft -f
# Firewall do Ararinha: bloqueia o que chega sem ter sido pedido.
flush ruleset

table inet ararinha {
  chain entrada {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    # Mensagens de controle (o IPv6 precisa delas). Responder ao ping só no
    # perfil "rede de casa" (regra em /etc/ararinha/firewall.nft).
    icmp type != echo-request accept
    icmpv6 type != echo-request accept
    # Respostas de DHCP (IPv4 e IPv6).
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
  }
  chain encaminhar {
    type filter hook forward priority filter; policy drop;
  }
  chain saida {
    type filter hook output priority filter; policy accept;
  }
}

# Perfil e portas liberadas (Configurações > Firewall, pelo ararinha-sistema).
include "/etc/ararinha/firewall*.nft"
FIM
chmod 600 /etc/nftables.conf
cat > /usr/lib/systemd/system/nftables.service << 'FIM'
[Unit]
Description=Firewall do Ararinha (nftables)
DefaultDependencies=no
Before=network-pre.target
Wants=network-pre.target

[Service]
Type=oneshot
RemainAfterExit=yes
# Desligado pela pessoa (Configurações › Firewall): não carrega regras.
ExecCondition=/bin/sh -c "! test -e /etc/ararinha/firewall-desligado"
ExecStart=/usr/sbin/nft -f /etc/nftables.conf
ExecReload=/usr/sbin/nft -f /etc/nftables.conf
ExecStop=/usr/sbin/nft flush ruleset
# Endurecimento: o serviço só enxerga e pode o mínimo.
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
CapabilityBoundingSet=CAP_NET_ADMIN
RestrictAddressFamilies=AF_NETLINK AF_UNIX
PrivateNetwork=no

[Install]
WantedBy=sysinit.target
FIM
systemctl enable nftables.service
''',
]
