# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "autoconf"
versao    = "2.73"
resumo    = "Gerador de scripts configure"
licenca   = "GPL-3.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz"

[dependencias]
construcao = ["perl"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
