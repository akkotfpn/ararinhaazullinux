# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "bash"
versao    = "5.3"
resumo    = "Shell Bourne-Again"
licenca   = "GPL-3.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz"

[dependencias]
construcao = ["grep"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --without-bash-malloc --with-installed-readline --docdir=/usr/share/doc/bash-5.3
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
