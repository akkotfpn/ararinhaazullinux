# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado com as ferramentas dos capítulos 5 a 7.

[pacote]
nome      = "bc"
versao    = "7.0.3"
resumo    = "Calculadora de precisão arbitrária"
licenca   = "BSD-2-Clause"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/gavinhoward/bc/releases/download/7.0.3/bc-7.0.3.tar.xz"

[dependencias]
construcao = ["m4"]

[construcao]
ambiente = "isolado"
passos = [
  '''
CC='gcc -std=c99' ./configure --prefix=/usr -G -O3 -r
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
