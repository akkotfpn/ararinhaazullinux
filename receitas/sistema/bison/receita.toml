# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "bison"
versao    = "3.8.2"
resumo    = "Gerador de analisadores"
licenca   = "GPL-3.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz"

[dependencias]
construcao = ["gettext"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --docdir=/usr/share/doc/bison-3.8.2
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
