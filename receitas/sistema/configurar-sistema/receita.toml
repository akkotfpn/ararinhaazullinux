# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 9 e 10 (edição systemd) com a identidade do Ararinha: nome, os-release,
# pt_BR.UTF-8, teclado ABNT2, rede por DHCP e tela de login com o Mingau.

[pacote]
nome      = "configurar-sistema"
versao    = "0.1"
resumo    = "Configuração do sistema (LFS 9 e 10) com a identidade do Ararinha"
licenca   = "GPL-3.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[dependencias]
construcao = ["spix-kernel"]

[construcao]
ambiente = "isolado"
passos = [
  '''
echo ararinha > /etc/hostname
''',
  '''
cat > /etc/os-release << "EOF"
NAME="Ararinha Azul Linux"
PRETTY_NAME="Ararinha Azul Linux 0.1 (Primeiro Pio)"
ID=ararinha
VERSION="0.1 (Primeiro Pio)"
VERSION_ID=0.1
VERSION_CODENAME=primeiro-pio
ANSI_COLOR="0;38;2;43;123;196"
HOME_URL="https://github.com/akkotfpn/ararinhaazullinux"
LOGO=ararinha
EOF
''',
  '''
echo 'LANG=pt_BR.UTF-8' > /etc/locale.conf
''',
  '''
printf 'KEYMAP=br-abnt2\nFONT=eurlatgr\n' > /etc/vconsole.conf
''',
  # Sem core dumps: a memória de um programa que travou pode ter senhas.
  '''
install -vdm755 /usr/lib/systemd/coredump.conf.d /usr/lib/systemd/system.conf.d /usr/lib/systemd/user.conf.d
printf '[Coredump]\nStorage=none\nProcessSizeMax=0\n' > /usr/lib/systemd/coredump.conf.d/50-ararinha.conf
printf '[Manager]\nDefaultLimitCORE=0\n' > /usr/lib/systemd/system.conf.d/50-ararinha.conf
printf '[Manager]\nDefaultLimitCORE=0\n' > /usr/lib/systemd/user.conf.d/50-ararinha.conf
''',
  '''
printf '/bin/sh\n/bin/bash\n' > /etc/shells
''',
  '''
cat > /etc/fstab << "EOF"
# Ararinha Azul Linux — a raiz é achada pelo nome da partição GPT
PARTLABEL=ararinha-raiz  /  ext4  defaults,x-systemd.growfs  1 1
EOF
''',
  # A raiz cresce até ocupar o disco todo no boot (systemd-repart aumenta a
  # partição; o x-systemd.growfs do fstab aumenta o ext4).
  '''
install -vdm755 /usr/lib/repart.d
cat > /usr/lib/repart.d/50-raiz.conf << "EOF"
[Partition]
Type=root
Label=ararinha-raiz
GrowFileSystem=yes
EOF
''',
  '''
mkdir -p /etc/systemd/network
cat > /etc/systemd/network/10-cabo.network << "EOF"
# Rede cabeada por DHCP (provisório na Fase 1; o Canto usa NetworkManager)
[Match]
Name=en* eth*

[Network]
DHCP=yes
LLMNR=no
MulticastDNS=no
IPv6PrivacyExtensions=yes

# Privacidade: não diz o nome do computador nem identifica o sistema para a
# rede; no IPv6 usa endereços temporários, que mudam.
[DHCPv4]
SendHostname=no
Anonymize=yes
EOF
mkdir -p /etc/systemd/resolved.conf.d
cat > /etc/systemd/resolved.conf.d/50-ararinha.conf << "EOF"
# DNS cifrado (DNS sobre TLS) sempre que o servidor aceitar
# e sem LLMNR nem mDNS, que anunciam o computador na rede.
[Resolve]
DNSOverTLS=opportunistic
DNSSEC=no
LLMNR=no
MulticastDNS=no
EOF
''',
  '''
systemctl enable systemd-networkd systemd-resolved
''',
  '''
ln -sfv ../run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
''',
  '''
cat > /etc/issue << "EOF"

        .--.
       / o  \\__     Ararinha Azul Linux 0.1 (Primeiro Pio)
      (   ___  >    Bem-vindo! O Mingau estava te esperando.
       \\  \\  \\/
        '--'--'     \n  \l

EOF
# o agetty interpreta "\x" como código; por isso a arte usa "\\"
''',
  '''
rm -f /etc/machine-id
''',
  # Primeiro boot: o Primeiro Voo (no Ninho, a tela de entrada) pergunta
  # idioma, teclado e fuso e cria a primeira conta; a senha dela passa a
  # valer também para o root. Até lá o root fica sem senha (só no console)
  # e o systemd-firstboot em texto não roda.
  '''
passwd -d root
ln -sfv /dev/null /etc/systemd/system/systemd-firstboot.service
ln -sfv ../usr/share/zoneinfo/America/Sao_Paulo /etc/localtime
''',
  # Segurança: kernel mais fechado (sem vazar endereços, sem BPF para
  # usuários, rede sem redirecionamentos) e senhas novas com yescrypt.
  '''
install -vdm755 /usr/lib/sysctl.d
cat > /usr/lib/sysctl.d/50-ararinha.conf << 'FIM'
# Endurecimento do Ararinha (ver docs/seguranca.md)
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.yama.ptrace_scope = 1
kernel.kexec_load_disabled = 1
kernel.sysrq = 176
dev.tty.ldisc_autoload = 0
fs.suid_dumpable = 0
fs.protected_fifos = 2
fs.protected_regular = 2
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
FIM
# Memória comprimida (zram): metade da RAM vira área de troca comprimida.
# Com 2 GB, o Chromium e a Central juntos não travam a máquina.
install -vdm755 /usr/libexec
cat > /usr/libexec/ararinha-zram << 'FIM'
#!/bin/sh
[ -e /sys/block/zram0 ] || modprobe zram num_devices=1 || exit 0
grep -q zram0 /proc/swaps && exit 0
mem=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
for alg in zstd lz4 lzo-rle lzo; do
  echo "$alg" > /sys/block/zram0/comp_algorithm 2>/dev/null && break
done
echo $((mem * 1024 / 2)) > /sys/block/zram0/disksize || exit 0
mkswap /dev/zram0 >/dev/null && swapon -p 100 /dev/zram0
FIM
chmod 755 /usr/libexec/ararinha-zram
cat > /usr/lib/systemd/system/ararinha-zram.service << 'FIM'
[Unit]
Description=Memória comprimida (zram)
DefaultDependencies=no
After=systemd-modules-load.service
Before=swap.target

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=/usr/libexec/ararinha-zram
ExecStop=-/usr/bin/swapoff /dev/zram0

[Install]
WantedBy=swap.target
FIM
systemctl enable ararinha-zram.service
echo 'vm.swappiness = 100' >> /usr/lib/sysctl.d/50-ararinha.conf
if [ -f /etc/login.defs ]; then
  sed -i 's/^#\?ENCRYPT_METHOD.*/ENCRYPT_METHOD YESCRYPT/' /etc/login.defs
  grep -q '^ENCRYPT_METHOD' /etc/login.defs || echo 'ENCRYPT_METHOD YESCRYPT' >> /etc/login.defs
fi
''',
]
instalar = [
]
