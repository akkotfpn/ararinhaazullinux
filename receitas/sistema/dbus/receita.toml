# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "dbus"
versao    = "1.16.2"
resumo    = "Barramento de mensagens do sistema"
licenca   = "AFL-2.1 OR GPL-2.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz"

[dependencias]
construcao = ["systemd"]

[construcao]
ambiente = "isolado"
passos = [
  # O pós-instalação do dbus faz os.chown() em Python; no ambiente isolado só
  # existe o uid 0, então a chamada vira nada. Dono e permissão do
  # launch-helper são aplicados na instalação, logo abaixo.
  '''
sed -i 's/os\.chown(/(lambda *a, **k: None)(/g' meson_post_install.py
! grep -q 'os\.chown(' meson_post_install.py
''',
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
  '''
chgrp messagebus /usr/libexec/dbus-daemon-launch-helper
chmod 4750 /usr/libexec/dbus-daemon-launch-helper
''',
  '''
mkdir -p /var/lib/dbus && ln -sfv /etc/machine-id /var/lib/dbus
''',
]
