# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "diffutils"
versao    = "3.12"
resumo    = "Comparação de arquivos"
licenca   = "GPL-3.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://ftp.gnu.org/gnu/diffutils/diffutils-3.12.tar.xz"

[dependencias]
construcao = ["coreutils"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
