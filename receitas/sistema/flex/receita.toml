# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado com as ferramentas dos capítulos 5 a 7.

[pacote]
nome      = "flex"
versao    = "2.6.4"
resumo    = "Gerador de analisadores léxicos"
licenca   = "BSD-2-Clause"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz"

[dependencias]
construcao = ["bc"]

[construcao]
ambiente = "isolado"
passos = [
  '''
sed -i "/math.h/a #include <malloc.h>" src/flexdef.h
''',
  '''
./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/flex-2.6.4
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
  '''
ln -sfv flex /usr/bin/lex
ln -sfv flex.1 /usr/share/man/man1/lex.1
''',
]
