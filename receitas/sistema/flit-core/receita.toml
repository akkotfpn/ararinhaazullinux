# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "flit-core"
versao    = "4.0.2"
resumo    = "Sistema de build Python (flit)"
licenca   = "BSD-3-Clause"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://files.pythonhosted.org/packages/source/f/flit-core/flit_core-4.0.2.tar.gz"

[dependencias]
construcao = ["python"]

[construcao]
ambiente = "isolado"
passos = [
  '''
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
''',
]
instalar = [
  '''
pip3 install --no-index --force-reinstall --find-links dist flit_core
''',
]
