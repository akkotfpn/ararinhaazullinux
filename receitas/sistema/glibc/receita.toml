# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado com as ferramentas dos capítulos 5 a 7.
# Diferenças do LFS: só os locales C.UTF-8, pt_BR.UTF-8 e en_US.UTF-8 (ADR 0009);
# fuso padrão America/Sao_Paulo (alterável no primeiro boot); sem testes.

[pacote]
nome      = "glibc"
versao    = "2.44"
resumo    = "Biblioteca C GNU"
licenca   = "LGPL-2.1-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz"

[[fonte]]
url = "https://www.linuxfromscratch.org/patches/lfs/development/glibc-fhs-1.patch"
extrair = false

[[fonte]]
url = "https://www.linuxfromscratch.org/patches/lfs/development/glibc-2.44-upstream_fixes-4.patch"
extrair = false

[[fonte]]
url = "https://www.iana.org/time-zones/repository/releases/tzdata2026d.tar.gz"
extrair = false

[dependencias]
construcao = ["limpeza-temporaria"]

[construcao]
ambiente = "isolado"
construir_em = "build"
passos = [
  '''
cd .. && patch -Np1 -i ../glibc-fhs-1.patch
''',
  '''
cd .. && patch -Np1 -i ../glibc-2.44-upstream_fixes-4.patch
''',
  '''
echo "rootsbindir=/usr/sbin" > configparms
''',
  '''
../configure --prefix=/usr                   \
             --disable-werror                \
             --disable-nscd                  \
             libc_cv_slibdir=/usr/lib        \
             --enable-stack-protector=strong \
             --enable-kernel=5.10
''',
  '''
make
''',
]
instalar = [
  '''
touch /etc/ld.so.conf
''',
  '''
sed '/test-installation/s@$(PERL)@echo not running@' -i ../Makefile
''',
  '''
make install
''',
  '''
sed '/RTLDLIST=/s@/usr@@g' -i /usr/bin/ldd
''',
  '''
localedef -i C -f UTF-8 C.UTF-8
localedef -i pt_BR -f UTF-8 pt_BR.UTF-8
localedef -i en_US -f UTF-8 en_US.UTF-8
''',
  '''
cat > /etc/nsswitch.conf << "EOF"
# Begin /etc/nsswitch.conf

passwd: files systemd
group: files systemd
shadow: files systemd

hosts: mymachines resolve [!UNAVAIL=return] files myhostname dns
networks: files

protocols: files
services: files
ethers: files
rpc: files

# End /etc/nsswitch.conf
EOF
''',
  '''
mkdir -p tz && tar -xf ../../tzdata2026d.tar.gz -C tz
cd tz
ZONEINFO=/usr/share/zoneinfo
mkdir -pv $ZONEINFO/{posix,right}
for tz in etcetera southamerica northamerica europe africa antarctica \
          asia australasia backward; do
    zic -L /dev/null   -d $ZONEINFO       ${tz}
    zic -L /dev/null   -d $ZONEINFO/posix ${tz}
    zic -L leapseconds -d $ZONEINFO/right ${tz}
done
cp -v zone.tab zone1970.tab iso3166.tab $ZONEINFO
zic -d $ZONEINFO -p America/New_York
''',
  '''
ln -sfv /usr/share/zoneinfo/America/Sao_Paulo /etc/localtime
''',
  '''
cat > /etc/ld.so.conf << "EOF"
# Begin /etc/ld.so.conf
/usr/local/lib
/opt/lib
include /etc/ld.so.conf.d/*.conf
EOF
mkdir -pv /etc/ld.so.conf.d
''',
]
