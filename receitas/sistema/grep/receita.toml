# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "grep"
versao    = "3.12"
resumo    = "Busca de texto"
licenca   = "GPL-3.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://ftp.gnu.org/gnu/grep/grep-3.12.tar.xz"

[dependencias]
construcao = ["bison"]

[construcao]
ambiente = "isolado"
passos = [
  '''
sed -i "s/echo/#echo/" src/egrep.sh
''',
  '''
./configure --prefix=/usr
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
