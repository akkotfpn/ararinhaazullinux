# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "jinja2"
versao    = "3.1.6"
resumo    = "Motor de templates (usado pelo systemd)"
licenca   = "BSD-3-Clause"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://files.pythonhosted.org/packages/source/J/Jinja2/jinja2-3.1.6.tar.gz"

[dependencias]
construcao = ["markupsafe"]

[construcao]
ambiente = "isolado"
passos = [
  '''
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
''',
]
instalar = [
  '''
pip3 install --no-index --force-reinstall --no-deps --find-links dist Jinja2
''',
]
