# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "kmod"
versao    = "34.2"
resumo    = "Módulos do kernel"
licenca   = "LGPL-2.1-or-later AND GPL-2.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://www.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.xz"

[dependencias]
construcao = ["jinja2"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr .. --buildtype=release -D manpages=false
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
