# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.
# Diferença do LFS: sem --with-gcc-arch=native (o Ararinha roda em qualquer CPU).

[pacote]
nome      = "libffi"
versao    = "3.8.0"
resumo    = "Interface de chamadas externas"
licenca   = "MIT"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz"

[dependencias]
construcao = ["libelf"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --disable-static
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
