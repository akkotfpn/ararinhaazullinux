# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "libtool"
versao    = "2.6.2"
resumo    = "Ferramenta de bibliotecas genéricas"
licenca   = "GPL-2.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://ftp.gnu.org/gnu/libtool/libtool-2.6.2.tar.xz"

[dependencias]
construcao = ["bash"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
  '''
rm -fv /usr/lib/libltdl.a
''',
]
