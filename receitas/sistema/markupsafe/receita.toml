# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "markupsafe"
versao    = "3.0.3"
resumo    = "Strings seguras para HTML"
licenca   = "BSD-3-Clause"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://files.pythonhosted.org/packages/source/M/MarkupSafe/markupsafe-3.0.3.tar.gz"

[dependencias]
construcao = ["meson"]

[construcao]
ambiente = "isolado"
passos = [
  '''
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
''',
]
instalar = [
  '''
pip3 install --no-index --force-reinstall --find-links dist Markupsafe
''',
]
