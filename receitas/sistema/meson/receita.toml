# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "meson"
versao    = "1.12.0"
resumo    = "Sistema de build Meson"
licenca   = "Apache-2.0"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/mesonbuild/meson/releases/download/1.12.0/meson-1.12.0.tar.gz"

[dependencias]
construcao = ["setuptools"]

[construcao]
ambiente = "isolado"
passos = [
  '''
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
''',
]
instalar = [
  '''
pip3 install --no-index --force-reinstall --find-links dist meson
''',
]
