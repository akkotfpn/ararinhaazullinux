# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "ncurses"
versao    = "6.6"
resumo    = "Biblioteca de interface de texto"
licenca   = "MIT"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz"

[dependencias]
construcao = ["gcc"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr           \
            --mandir=/usr/share/man \
            --with-shared           \
            --without-debug         \
            --without-normal        \
            --with-cxx-shared       \
            --enable-pc-files       \
            --with-pkg-config-libdir=/usr/lib/pkgconfig
''',
  '''
make
''',
]
instalar = [
  '''
rm -rf dest && make DESTDIR=$PWD/dest install
''',
  '''
sed -e 's/^#if.*XOPEN.*$/#if 1/' -i dest/usr/include/curses.h
''',
  '''
cp --remove-destination -av dest/* /
''',
  '''
for lib in ncurses form panel menu ; do
    ln -sfv lib${lib}w.so /usr/lib/lib${lib}.so
    ln -sfv ${lib}w.pc    /usr/lib/pkgconfig/${lib}.pc
done
ln -sfv libncursesw.so /usr/lib/libcurses.so
''',
]
