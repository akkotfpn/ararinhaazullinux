# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "packaging"
versao    = "26.3"
resumo    = "Utilitários de empacotamento Python"
licenca   = "Apache-2.0 OR BSD-2-Clause"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://files.pythonhosted.org/packages/source/p/packaging/packaging-26.3.tar.gz"

[dependencias]
construcao = ["flit-core"]

[construcao]
ambiente = "isolado"
passos = [
  '''
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
''',
]
instalar = [
  '''
pip3 install --no-index --force-reinstall --find-links dist packaging
''',
]
