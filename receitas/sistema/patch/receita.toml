# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "patch"
versao    = "2.8.1"
resumo    = "Aplicação de patches"
licenca   = "GPL-3.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://ftp.gnu.org/gnu/patch/patch-2.8.1.tar.xz"

[dependencias]
construcao = ["make"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
