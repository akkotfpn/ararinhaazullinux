# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado com as ferramentas dos capítulos 5 a 7.

[pacote]
nome      = "readline"
versao    = "8.3"
resumo    = "Edição de linha de comando"
licenca   = "GPL-3.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz"

[dependencias]
construcao = ["file"]

[construcao]
ambiente = "isolado"
passos = [
  '''
sed -i '/MV.*old/d' Makefile.in
sed -i '/{OLDSUFF}/c:' support/shlib-install
sed -i 's/-Wl,-rpath,[^ ]*//' support/shobj-conf
''',
  '''
sed -e '270a\
     else\
       chars_avail = 1;'      \
    -e '288i\   result = -1;' \
    -i.orig input.c
''',
  '''
./configure --prefix=/usr --disable-static --with-curses --docdir=/usr/share/doc/readline-8.3
''',
  '''
make SHLIB_LIBS="-lncursesw"
''',
]
instalar = [
  '''
make install
''',
]
