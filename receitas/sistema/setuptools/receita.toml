# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "setuptools"
versao    = "84.0.0"
resumo    = "Ferramentas de instalação Python"
licenca   = "MIT"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://files.pythonhosted.org/packages/source/s/setuptools/setuptools-84.0.0.tar.gz"

[dependencias]
construcao = ["wheel"]

[construcao]
ambiente = "isolado"
passos = [
  '''
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD
''',
]
instalar = [
  '''
pip3 install --no-index --force-reinstall --find-links dist setuptools
''',
]
