# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado com as ferramentas dos capítulos 5 a 7.

[pacote]
nome      = "shadow"
versao    = "4.20.2"
resumo    = "Senhas e contas de usuário"
licenca   = "BSD-3-Clause"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/shadow-maint/shadow/releases/download/4.20.2/shadow-4.20.2.tar.xz"

[dependencias]
construcao = ["libxcrypt"]

[construcao]
ambiente = "isolado"
passos = [
  '''
sed -i 's/groups$(EXEEXT) //' src/Makefile.in
''',
  '''
find man -name Makefile.in -exec sed -i 's/groups\.1 / /'   {} \;
find man -name Makefile.in -exec sed -i 's/getspnam\.3 / /' {} \;
find man -name Makefile.in -exec sed -i 's/passwd\.5 / /'   {} \;
''',
  '''
sed -e 's:#ENCRYPT_METHOD SHA512:ENCRYPT_METHOD YESCRYPT:' \
    -e 's:/var/spool/mail:/var/mail:'                      \
    -e '/PATH=/{s@/sbin:@@;s@/bin:@@}'                     \
    -i etc/login.defs
''',
  '''
touch /usr/bin/passwd
''',
  '''
./configure --sysconfdir=/etc --disable-static --with-{b,yes}crypt --without-libbsd --disable-logind --with-group-name-max-length=32
''',
  '''
make
''',
]
instalar = [
  '''
make exec_prefix=/usr install
''',
  '''
make -C man install-man
''',
  '''
pwconv
grpconv
''',
  '''
mkdir -p /etc/default
useradd -D --gid 999
sed -i '/MAIL/s/yes/no/' /etc/default/useradd
''',
  '''
touch /etc/sub{u,g}id
''',
]
