# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 10.3 com a configuração do Spix Kernel (docs/adr/0001): defconfig da
# arquitetura + fragmentos de kernel/config. O kernel é um aplicativo UEFI
# (EFI stub) e inicia direto do firmware no primeiro boot.

[pacote]
nome      = "spix-kernel"
versao    = "7.1.8"
resumo    = "Spix Kernel: o kernel Linux do Ararinha"
licenca   = "GPL-2.0-only"
categoria = "sistema"
tipo      = "toolchain"

[fonte]
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.8.tar.xz"

[dependencias]
construcao = ["e2fsprogs", "openssl", "cryptsetup", "kbd", "util-linux", "bash"]

[construcao]
ambiente = "isolado"
copiar = ["kernel/config", "kernel/initramfs"]
passos = [
  '''
make mrproper
''',
  '''
make defconfig
''',
  '''
scripts/kconfig/merge_config.sh -m .config ../config/base.config ../config/vm.config ../config/desktop.config ../config/primeiro-boot.config
''',
  '''
make olddefconfig
''',
  '''
make
''',
]
instalar = [
  '''
make modules_install
''',
  '''
mkdir -p /boot
case $(uname -m) in
  x86_64)  cp -v arch/x86/boot/bzImage /boot/vmlinuz-spix ;;
  aarch64) cp -v arch/arm64/boot/Image  /boot/vmlinuz-spix ;;
esac
cp -v .config /boot/config-spix
''',
  # Segunda variante, para discos criptografados: o mesmo kernel com uma
  # initramfs embutida (cryptsetup + init próprio). Só muda o que depende de
  # CONFIG_INITRAMFS_SOURCE, então o segundo make é rápido. O instalador põe
  # este .efi na ESP quando o usuário escolhe criptografar.
  '''
I=$PWD/../initramfs-raiz
rm -rf $I && mkdir -p $I/usr/bin $I/usr/lib $I/usr/share/keymaps $I/dev $I/proc $I/sys $I/run $I/root
ln -s usr/bin $I/bin; ln -s usr/bin $I/sbin; ln -s usr/lib $I/lib; ln -s usr/lib $I/lib64
install -m755 ../initramfs/init $I/init
for b in bash cryptsetup blkid mount umount switch_root loadkeys sleep seq head; do
  f=$(command -v $b || ls /usr/sbin/$b /sbin/$b 2>/dev/null | head -n1)
  [ -n "$f" ] || { echo "initramfs: faltou $b"; exit 1; }
  cp -L "$f" $I/usr/bin/
  ldd "$f" 2>/dev/null | grep -o '/[^ ]*' | while read -r l; do cp -Ln "$l" $I/usr/lib/ 2>/dev/null || true; done
done
strip --strip-unneeded $I/usr/bin/* $I/usr/lib/*.so* 2>/dev/null || true
# mapa br-abnt2 e os "include" de que ele precisa, nos mesmos caminhos
k=$(find /usr/share/keymaps -name 'br-abnt2.map*' | head -n1)
[ -n "$k" ] || { echo "initramfs: faltou o mapa br-abnt2"; exit 1; }
mkdir -p $I$(dirname $k) && cp $k $I$k
find /usr/share/keymaps -type d -name include | while read -r d; do mkdir -p $I$d && cp -a $d/. $I$d/; done
scripts/config --set-str INITRAMFS_SOURCE "$I" --set-val INITRAMFS_ROOT_UID 0 --set-val INITRAMFS_ROOT_GID 0 \
               --enable INITRAMFS_COMPRESSION_ZSTD
make olddefconfig
make
mkdir -p /usr/lib/ararinha
case $(uname -m) in
  x86_64)  cp -v arch/x86/boot/bzImage /usr/lib/ararinha/vmlinuz-spix-cripto ;;
  aarch64) cp -v arch/arm64/boot/Image  /usr/lib/ararinha/vmlinuz-spix-cripto ;;
esac
du -h /usr/lib/ararinha/vmlinuz-spix-cripto
''',
  '''
# A chave privada que assinou os módulos não sai da pasta de construção
# (e é apagada aqui): o sistema instalado só tem a parte pública, no kernel.
rm -f certs/signing_key.pem certs/signing_key.x509.signer 2>/dev/null
for op in CONFIG_MODULE_SIG CONFIG_EFI_STUB CONFIG_EXT4_FS CONFIG_SCSI_VIRTIO CONFIG_VIRTIO_BLK CONFIG_DEVTMPFS \
          CONFIG_DRM_FBDEV_EMULATION CONFIG_FRAMEBUFFER_CONSOLE CONFIG_SYSFB_SIMPLEFB \
          CONFIG_INPUT_EVDEV; do
  grep -q "^$op=y" .config || { echo "faltou $op=y"; exit 1; }
done
''',
]
