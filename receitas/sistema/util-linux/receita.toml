# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado.

[pacote]
nome      = "util-linux"
versao    = "2.42.4"
resumo    = "Utilitários de sistema"
licenca   = "GPL-2.0-or-later"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.4.tar.xz"

[dependencias]
construcao = ["tar"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --bindir=/usr/bin     \
            --libdir=/usr/lib     \
            --runstatedir=/run    \
            --sbindir=/usr/sbin   \
            --disable-chfn-chsh   \
            --disable-login       \
            --disable-nologin     \
            --disable-su          \
            --disable-setpriv     \
            --disable-runuser     \
            --disable-pylibmount  \
            --disable-liblastlog2 \
            --disable-static      \
            --without-python      \
            ADJTIME_PATH=/var/lib/hwclock/adjtime \
            --docdir=/usr/share/doc/util-linux-2.42.4
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
