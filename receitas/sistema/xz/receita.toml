# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado com as ferramentas dos capítulos 5 a 7.

[pacote]
nome      = "xz"
versao    = "5.8.4"
resumo    = "Compressão xz/lzma"
licenca   = "0BSD"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz"

[dependencias]
construcao = ["bzip2"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/xz-5.8.4
''',
  '''
make
''',
]
instalar = [
  '''
make install
''',
]
