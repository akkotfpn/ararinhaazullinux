# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 8 (livro LFS, edição systemd): sistema final do Ararinha, compilado
# dentro do ambiente isolado com as ferramentas dos capítulos 5 a 7.

[pacote]
nome      = "zstd"
versao    = "1.5.7"
resumo    = "Compressão Zstandard"
licenca   = "BSD-3-Clause OR GPL-2.0-only"
categoria = "sistema"
tipo      = "toolchain"

[[fonte]]
url = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"

[dependencias]
construcao = ["lz4"]

[construcao]
ambiente = "isolado"
passos = [
  '''
make prefix=/usr
''',
]
instalar = [
  '''
make prefix=/usr install
''',
  '''
rm -v /usr/lib/libzstd.a
''',
]
