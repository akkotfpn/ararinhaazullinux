# LFS 6 (livro r13.1-39-systemd): ferramentas temporárias, compiladas em modo
# cruzado com a toolchain do capítulo 5 e instaladas direto na raiz.

[pacote]
nome      = "bash"
versao    = "5.3"
resumo    = "Shell Bourne-Again (temporário)"
licenca   = "GPL-3.0-or-later"
categoria = "temporarias"
tipo      = "toolchain"

[fonte]
url = "https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz"

[dependencias]
construcao = ["toolchain", "ncurses"]

[construcao]
passos = [
  """
  ./configure --prefix=/usr \
              --host=$ALVO \
              --build=$(sh support/config.guess) \
              --without-bash-malloc \
              --docdir=/usr/share/doc/bash-5.3
  """,
"make",
]
instalar = [
  "make DESTDIR=$RAIZ install",
  "ln -sfv bash $RAIZ/bin/sh",
]
