# LFS 6 (livro r13.1-39-systemd): ferramentas temporárias, compiladas em modo
# cruzado com a toolchain do capítulo 5 e instaladas direto na raiz.

[pacote]
nome      = "coreutils"
versao    = "9.12"
resumo    = "Utilitários básicos (ls, cp, mv…) (temporário)"
licenca   = "GPL-3.0-or-later"
categoria = "temporarias"
tipo      = "toolchain"

[fonte]
url = "https://ftp.gnu.org/gnu/coreutils/coreutils-9.12.tar.xz"

[dependencias]
construcao = ["toolchain"]

[construcao]
passos = [
  """
  ./configure --prefix=/usr \
              --host=$ALVO \
              --build=$(build-aux/config.guess) \
              --enable-install-program=hostname
  """,
"make",
]
instalar = [
  "make DESTDIR=$RAIZ install",
  "mv -v $RAIZ/usr/bin/chroot $RAIZ/usr/sbin",
  "mkdir -pv $RAIZ/usr/share/man/man8",
  "mv -v $RAIZ/usr/share/man/man1/chroot.1 $RAIZ/usr/share/man/man8/chroot.8",
  "sed -i 's/\"1\"/\"8\"/' $RAIZ/usr/share/man/man8/chroot.8",
]
