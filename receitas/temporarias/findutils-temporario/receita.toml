# LFS 6 (livro r13.1-39-systemd): ferramentas temporárias, compiladas em modo
# cruzado com a toolchain do capítulo 5 e instaladas direto na raiz.

[pacote]
nome      = "findutils-temporario"
versao    = "4.11.0"
resumo    = "Busca de arquivos (find, xargs) (temporário)"
licenca   = "GPL-3.0-or-later"
categoria = "temporarias"
tipo      = "toolchain"

[fonte]
url = "https://ftp.gnu.org/gnu/findutils/findutils-4.11.0.tar.xz"

[dependencias]
construcao = ["toolchain"]

[construcao]
passos = [
  """
  ./configure --prefix=/usr \
              --host=$ALVO \
              --build=$(build-aux/config.guess) \
              --localstatedir=/var/lib/locate
  """,
"make",
]
instalar = [
  "make DESTDIR=$RAIZ install",
]
