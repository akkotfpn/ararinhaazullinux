# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 6 (livro r13.1-39-systemd): ferramentas temporárias, compiladas em modo
# cruzado com a toolchain do capítulo 5 e instaladas direto na raiz.

[pacote]
nome      = "gawk-temporario"
versao    = "5.4.1"
resumo    = "Linguagem AWK do GNU (temporário)"
licenca   = "GPL-3.0-or-later"
categoria = "temporarias"
tipo      = "toolchain"

[fonte]
url = "https://ftp.gnu.org/gnu/gawk/gawk-5.4.1.tar.xz"

[dependencias]
construcao = ["toolchain"]

[construcao]
passos = [
"sed -i 's/extras//' Makefile.in",
  """
  ./configure --prefix=/usr \
              --host=$ALVO \
              --build=$(build-aux/config.guess)
  """,
"make",
]
instalar = [
  "make DESTDIR=$RAIZ install",
]
