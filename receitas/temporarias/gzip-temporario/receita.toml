# SPDX-License-Identifier: GPL-3.0-or-later
# LFS 6 (livro r13.1-39-systemd): ferramentas temporárias, compiladas em modo
# cruzado com a toolchain do capítulo 5 e instaladas direto na raiz.

[pacote]
nome      = "gzip-temporario"
versao    = "1.15"
resumo    = "Compressão gzip (temporário)"
licenca   = "GPL-3.0-or-later"
categoria = "temporarias"
tipo      = "toolchain"

[fonte]
url = "https://ftp.gnu.org/gnu/gzip/gzip-1.15.tar.xz"

[dependencias]
construcao = ["toolchain"]

[construcao]
passos = [
  # Diferença do LFS (só no aarch64): gzip.h define a macro `head`, e os
  # cabeçalhos de sinal do kernel arm64 têm campos chamados `head`. Incluir
  # <signal.h> no gzip.c antes do gzip.h (logo depois do config.h) evita que
  # a macro estrague esses cabeçalhos. Não usar CFLAGS="-include": quebra o
  # configure.
  """
  if [ "$ARQ" = aarch64 ]; then
    sed -i '/#include <config.h>/a #include <signal.h>' gzip.c
    grep -q '^#include <signal.h>' gzip.c
  fi
  """,
  "./configure --prefix=/usr --host=$ALVO",
  "make",
]
instalar = [
  "make DESTDIR=$RAIZ install",
]
