# LFS 6 (livro r13.1-39-systemd): ferramentas temporárias, compiladas em modo
# cruzado com a toolchain do capítulo 5 e instaladas direto na raiz.

[pacote]
nome      = "gzip"
versao    = "1.15"
resumo    = "Compressão gzip (temporário)"
licenca   = "GPL-3.0-or-later"
categoria = "temporarias"
tipo      = "toolchain"

[fonte]
url = "https://ftp.gnu.org/gnu/gzip/gzip-1.15.tar.xz"

[dependencias]
construcao = ["toolchain"]

[construcao]
passos = [
  """
  ./configure --prefix=/usr \
              --host=$ALVO
  """,
"make",
]
instalar = [
  "make DESTDIR=$RAIZ install",
]
