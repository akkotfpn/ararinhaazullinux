# XWayland (apps X11, como a Steam): BLFS, font-util

[pacote]
nome      = "font-util"
versao    = "1.4.1"
resumo    = "Utilitários de fontes do X"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/font/font-util-1.4.1.tar.xz"

[dependencias]
construcao = ["util-macros"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
''',
  '''
make -j$NUCLEOS
''',
]
instalar = [
  '''
make install
''',
]
