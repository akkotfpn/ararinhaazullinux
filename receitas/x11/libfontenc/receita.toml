# XWayland (apps X11, como a Steam): BLFS, libfontenc

[pacote]
nome      = "libfontenc"
versao    = "1.1.9"
resumo    = "Codificação de fontes do X"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/lib/libfontenc-1.1.9.tar.xz"

[dependencias]
construcao = ["xorgproto", "util-macros"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
''',
  '''
make -j$NUCLEOS
''',
]
instalar = [
  '''
make install
''',
]
