# XWayland (apps X11, como a Steam): BLFS, libxcvt

[pacote]
nome      = "libxcvt"
versao    = "0.1.3"
resumo    = "Modos de vídeo VESA CVT"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/lib/libxcvt-0.1.3.tar.xz"

[dependencias]
construcao = ["meson"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
