# GLX no Xwayland (Steam e jogos X11): BLFS, libXext

[pacote]
nome      = "libxext"
versao    = "1.3.7"
resumo    = "Extensões do X"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/lib/libXext-1.3.7.tar.xz"

[dependencias]
construcao = ["libx11"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
''',
  '''
make -j$NUCLEOS
''',
]
instalar = [
  '''
make install
''',
]
