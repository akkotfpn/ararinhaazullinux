# GLX no Xwayland (Steam e jogos X11): BLFS, libXfixes

[pacote]
nome      = "libxfixes"
versao    = "6.0.2"
resumo    = "Extensão XFIXES"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/lib/libXfixes-6.0.2.tar.xz"

[dependencias]
construcao = ["libx11"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
''',
  '''
make -j$NUCLEOS
''',
]
instalar = [
  '''
make install
''',
]
