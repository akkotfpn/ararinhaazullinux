# XWayland (apps X11, como a Steam): BLFS, libXfont2

[pacote]
nome      = "libxfont2"
versao    = "2.0.9"
resumo    = "Fontes do servidor X"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/lib/libXfont2-2.0.9.tar.xz"

[dependencias]
construcao = ["libfontenc", "freetype", "xtrans"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static --disable-devel-docs
''',
  '''
make -j$NUCLEOS
''',
]
instalar = [
  '''
make install
''',
]
