# XWayland (apps X11, como a Steam): BLFS, libxkbfile

[pacote]
nome      = "libxkbfile"
versao    = "1.2.0"
resumo    = "Arquivos de teclado do X"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/lib/libxkbfile-1.2.0.tar.xz"

[dependencias]
construcao = ["libX11", "meson"]

[construcao]
ambiente = "isolado"
passos = [
  '''
mkdir -p build && cd build && meson setup --prefix=/usr --buildtype=release --wrap-mode=nofallback ..
''',
  '''
cd build && ninja
''',
]
instalar = [
  '''
cd build && ninja install
''',
]
