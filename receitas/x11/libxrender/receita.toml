# GLX no Xwayland (Steam e jogos X11): BLFS, libXrender

[pacote]
nome      = "libxrender"
versao    = "0.9.13"
resumo    = "Extensão RENDER"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/lib/libXrender-0.9.13.tar.xz"

[dependencias]
construcao = ["libx11"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
''',
  '''
make -j$NUCLEOS
''',
]
instalar = [
  '''
make install
''',
]
