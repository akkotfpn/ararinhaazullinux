# GLX no Xwayland (Steam e jogos X11): BLFS, libXxf86vm

[pacote]
nome      = "libxxf86vm"
versao    = "1.1.7"
resumo    = "Extensão XF86VidMode"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/lib/libXxf86vm-1.1.7.tar.xz"

[dependencias]
construcao = ["libxext"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
''',
  '''
make -j$NUCLEOS
''',
]
instalar = [
  '''
make install
''',
]
