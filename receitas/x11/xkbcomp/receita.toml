# XWayland (apps X11, como a Steam): BLFS, xkbcomp

[pacote]
nome      = "xkbcomp"
versao    = "1.4.7"
resumo    = "Compilador de mapas de teclado"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/app/xkbcomp-1.4.7.tar.xz"

[dependencias]
construcao = ["libxkbfile", "libx11"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
''',
  '''
make -j$NUCLEOS
''',
]
instalar = [
  '''
make install
''',
]
