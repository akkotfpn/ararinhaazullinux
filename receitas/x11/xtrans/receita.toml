# XWayland (apps X11, como a Steam): BLFS, xtrans

[pacote]
nome      = "xtrans"
versao    = "1.6.0"
resumo    = "Transporte das bibliotecas X"
licenca   = "MIT"
categoria = "x11"
tipo      = "toolchain"

[[fonte]]
url = "https://www.x.org/pub/individual/lib/xtrans-1.6.0.tar.xz"

[dependencias]
construcao = ["util-macros"]

[construcao]
ambiente = "isolado"
passos = [
  '''
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
''',
  '''
make -j$NUCLEOS
''',
]
instalar = [
  '''
make install
''',
]
